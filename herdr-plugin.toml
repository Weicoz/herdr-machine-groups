id = "herdr-machine-groups"
name = "Machine Groups"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Tag, group, and fold saved SSH machines in an interactive TUI popup. Focus sidebar on specific groups."
platforms = ["macos", "linux"]

[[panes]]
id = "manager"
title = "Machine Groups"
placement = "popup"
width = 84
height = 26
command = ["python3", "bin/machine-groups.py"]

[[actions]]
id = "open"
title = "Machines: manage groups & fold"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin herdr-machine-groups --entrypoint manager --placement popup --focus"]

[[actions]]
id = "show-all"
title = "Machines: show all in sidebar"
command = ["python3", "bin/machine-groups.py", "show-all"]

[[actions]]
id = "focus-cloud"
title = "Machines: focus cloud group"
command = ["python3", "bin/machine-groups.py", "focus", "cloud"]

[[actions]]
id = "focus-office"
title = "Machines: focus office/local group"
command = ["python3", "bin/machine-groups.py", "focus", "office"]

[[actions]]
id = "focus-easytier"
title = "Machines: focus EasyTier group"
command = ["python3", "bin/machine-groups.py", "focus", "easytier"]
